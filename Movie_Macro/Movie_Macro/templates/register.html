{% extends "layout.html" %}

{% block content %}
<div class="jumbotron">
    <h1>회원가입</h1>
    <p class="lead">새 계정을 생성할 수 있습니다.</p>
</div>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">
    <div class="form-group">
        <label for="userid">아이디</label>
        <input type="text" class="form-control" id="userid" name="userid" placeholder="아이디 입력">
    </div>
    <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호 입력">
    </div>
    <div class="form-group">
        <label for="password2">비밀번호 확인</label>
        <input type="password" class="form-control" id="password2" name="password2" placeholder="비밀번호 다시 입력">
    </div>
    <button type="submit" class="btn btn-success">회원가입</button>
</form>
{% endblock %}
